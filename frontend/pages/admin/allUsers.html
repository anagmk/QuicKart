<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickKart Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../../assets/css/admin-dashboard.css">
</head>

<body>


    <header class="dashboard-header">

        <h1 class="logo">
            QuicKart
        </h1>

        <div class="profile">

            <i class="bi bi-person-circle"></i>

        </div>

    </header>

    <!-- Body -->

    <div class="container-fluid">

        <div class="row">

            <!-- Sidebar -->

            <aside class="col-lg-2 sidebar">

                <ul class="nav flex-column">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            <i class="bi bi-speedometer2"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-bag"></i>
                            Orders
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-box-seam"></i>
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-bar-chart"></i>
                            Sales Report
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/admin/users/allUsers">
                            <i class="bi bi-people"></i>
                            Customers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-ticket-perforated"></i>
                            Coupons
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-grid"></i>
                            Categories
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            Refund / Return
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-image"></i>
                            Banners
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-person-plus"></i>
                            Referrals
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            <i class="bi bi-tags"></i>
                            Offers
                        </a>
                    </li>

                    <li class="nav-item mt-auto">
                        <a class="nav-link" href="#">
                            <i class="bi bi-box-arrow-left"></i>
                            Sign Out
                        </a>
                    </li>

                </ul>

            </aside>

            <!-- Content -->

            <main class="col-lg-10 content-area">

                <h3>Dashboard</h3>

                <div class="content-placeholder">
                    <table class="table table-hover align-middle">

                        <thead class="table-dark">
                            <tr>
                                <th>Customer</th>
                                <th>Customer ID</th>
                                <th>Orders</th>
                                <th>Balance</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="userTable"></tbody>

                    </table>



                </div>

            </main>

        </div>

    </div>

    <!-- Footer -->

    <footer class="dashboard-footer">

        © 2025 | G-ROCK | All Rights Reserved. | We Give You Style.

    </footer>

    <script src="../../assets/js/admin/allUsers.js"></script>

</body>

</html>
