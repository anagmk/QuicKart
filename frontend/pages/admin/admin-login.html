<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickKart Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-box">

        <h1 class="logo">QuicKart</h1>

        <form id="adminLoginForm">

            <div class="mb-4">
                <input
                    id="email"
                    type="email"
                    class="form-control login-input"
                    placeholder="Email Address"
                    required>
            </div>

            <div class="mb-2 position-relative">

                <input
                    id="password"
                    type="password"
                    class="form-control login-input pe-5"
                    placeholder="Password"
                    required>

                <button
                    type="button"
                    class="eye-btn">

                    <svg xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        fill="currentColor"
                        viewBox="0 0 16 16">

                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zm-8 4.5A4.5 4.5 0 118 3.5a4.5 4.5 0 010 9z"/>

                        <path d="M8 5.5A2.5 2.5 0 108 10.5a2.5 2.5 0 000-5z"/>

                    </svg>

                </button>

            </div>

            <div class="text-end mb-4">
                <a href="#" class="forgot-link">
                    Forget Password?
                </a>
            </div>

            <button class="btn login-btn" type="submit">
                Login
            </button>

        </form>

    </div>

</div>

<script src="../../assets/js/admin/login.js"></script>
</body>

</html>
