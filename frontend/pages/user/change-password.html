<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickKart | Change Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #cabbbb;
            min-height: 100vh;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .change-card {
            width: 650px;
            background: #fff;
            border-radius: 30px;
            padding: 70px 80px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
        }

        .title {
            text-align: center;
            font-weight: 700;
            font-size: 46px;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 35px;
            font-size: 18px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .form-control {
            height: 55px;
            border-radius: 14px 0 0 14px;
            padding-left: 20px;
            box-shadow: none;
            border-right: none;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #6b5f5f;
        }

        .input-group .btn {
            border-radius: 0 14px 14px 0;
            background: #fff;
            border-left: none;
            color: #666;
            height: 55px;
        }

        .input-group .btn:hover {
            background: #fff;
        }

        .input-group .btn:focus {
            box-shadow: none;
        }

        .send-btn {
            width: 220px;
            height: 55px;
            border: none;
            border-radius: 16px;
            background: #665d5d;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            transition: .3s;
        }

        .send-btn:hover {
            background: #564d4d;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #333;
            text-decoration: none;
            font-size: 18px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media(max-width:768px) {

            .change-card {
                width: 100%;
                padding: 40px 25px;
            }

            .title {
                font-size: 34px;
            }

        }
    </style>

</head>

<body>

    <div class="container page-wrapper">

        <div class="change-card">

            <h1 class="title">
                Change Password
            </h1>

            <p class="subtitle">
                Please confirm your password
            </p>

            <form id="changePasswordForm">

                <p id="formMessage" class="small text-center" aria-live="polite"></p>

                <div class="input-group">

                    <input type="password" class="form-control" id="oldPassword" placeholder="Enter Old Password"
                        required>

                    <button type="button" class="btn btn-outline-secondary toggle-password" data-target="oldPassword">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

                <div class="input-group">

                    <input type="password" class="form-control" id="newPassword" placeholder="Enter New Password"
                        required>

                    <button type="button" class="btn btn-outline-secondary toggle-password"
                        data-target="newPassword">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

                <div class="text-center mt-4">

                    <button type="submit" class="send-btn">

                        Change Password

                    </button>

                </div>

                <div class="text-center">

                    <a href="/user/profile" class="back-link">

                        Go back to Profile

                    </a>

                </div>

            </form>

        </div>

    </div>

    <script>
        const form = document.getElementById("changePasswordForm");
        const message = document.getElementById("formMessage");

        // Show / Hide Password
        document.querySelectorAll(".toggle-password").forEach((button) => {

            button.addEventListener("click", () => {

                const input = document.getElementById(button.dataset.target);
                const icon = button.querySelector("i");

                if (input.type === "password") {

                    input.type = "text";
                    icon.classList.replace("bi-eye", "bi-eye-slash");

                } else {

                    input.type = "password";
                    icon.classList.replace("bi-eye-slash", "bi-eye");

                }

            });

        });

        // Change Password
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            message.textContent = "";
            message.className = "small text-center";

            const oldPassword = document.getElementById("oldPassword").value.trim();
            const newPassword = document.getElementById("newPassword").value.trim();

            // Validation
            if (!oldPassword || !newPassword) {

                message.textContent = "Please fill in all fields.";
                message.className = "small text-center text-danger";
                return;

            }

            if (oldPassword === newPassword) {

                message.textContent = "New password cannot be the same as the old password.";
                message.className = "small text-center text-danger";
                return;

            }

            try {

                const response = await fetch("/user/change-password", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    credentials: "include",

                    body: JSON.stringify({
                        oldPassword,
                        newPassword
                    })

                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Unable to change password.");
                }

                message.textContent = data.message || "Password changed successfully.";
                message.className = "small text-center text-success";

                form.reset();
                window.location.href = "/user/profile";

            } catch (error) {

                message.textContent = error.message;
                message.className = "small text-center text-danger";

            }

        });
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
