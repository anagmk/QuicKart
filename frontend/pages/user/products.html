<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuicKart | Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Poppins:wght@400;500&family=Volkhov&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="qk-navbar">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="logo text-decoration-none" href="/user/home">QuicKart</a>
      <form id="productSearchForm" class="search-pill" role="search">
        <span class="material-icons" style="font-size:16px;">search</span>
        <input id="productSearch" type="search" placeholder="Search products" aria-label="Search products">
      </form>
      <div class="qk-icons">
        <a href="/user/profile" aria-label="Profile"><span class="material-icons">account_circle</span></a>
        <a href="/user/cart" aria-label="Cart"><span class="material-icons">shopping_bag</span></a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
      <div>
        <p class="text-uppercase text-muted small mb-1">QuicKart collection</p>
        <h1 class="mb-0">Shop products</h1>
      </div>
      <p id="productCount" class="text-muted mb-0" aria-live="polite"></p>
    </div>

    <form id="productFilters" class="row g-2 align-items-end mb-4">
      <div class="col-sm-6 col-md-3">
        <label class="form-label" for="categoryFilter">Category</label>
        <select id="categoryFilter" class="form-select"><option value="">All categories</option></select>
      </div>
      <div class="col-sm-6 col-md-2">
        <label class="form-label" for="sizeFilter">Size</label>
        <input id="sizeFilter" class="form-control" placeholder="e.g. M">
      </div>
      <div class="col-sm-6 col-md-2">
        <label class="form-label" for="colorFilter">Colour</label>
        <input id="colorFilter" class="form-control" placeholder="e.g. Black">
      </div>
      <div class="col-sm-6 col-md-2">
        <label class="form-label" for="priceFilter">Price range</label>
        <select id="priceFilter" class="form-select">
          <option value="">Any price</option>
          <option value="0-500">Under ₹500</option>
          <option value="500-1000">₹500–₹1,000</option>
          <option value="1000-5000">₹1,000–₹5,000</option>
          <option value="5000-9999999">Over ₹5,000</option>
        </select>
      </div>
      <div class="col-sm-6 col-md-2">
        <label class="form-label" for="sortFilter">Sort by</label>
        <select id="sortFilter" class="form-select">
          <option value="latest">Latest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="oldest">Oldest</option>
        </select>
      </div>
      <div class="col-sm-6 col-md-1 d-grid"><button class="btn btn-dark" type="submit">Apply</button></div>
    </form>

    <div id="productGrid" class="row g-4 row-cols-2 row-cols-md-3 row-cols-lg-4" aria-live="polite"></div>
    <nav class="mt-5" aria-label="Product pages"><ul id="productPagination" class="pagination justify-content-center"></ul></nav>
  </main>

  <script src="/assets/js/user/products.js"></script>
</body>
</html>
