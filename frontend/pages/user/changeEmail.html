<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickKart | Change Email</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #cabbbb;
            min-height: 100vh;
        }

        .page-wrapper {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .change-card {
            width: 650px;
            background: #fff;
            border-radius: 30px;
            padding: 70px 80px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, .12);
        }

        .title {
            text-align: center;
            font-weight: 700;
            font-size: 46px;
            margin-bottom: 45px;
        }

        .form-control {
            height: 55px;
            border-radius: 14px;
            margin-bottom: 18px;
            padding-left: 20px;
            box-shadow: none;
        }

        .form-control:focus {
            box-shadow: none;
            border-color: #6b5f5f;
        }

        .send-btn {
            width: 220px;
            height: 55px;
            border: none;
            border-radius: 16px;
            background: #665d5d;
            color: #fff;
            font-size: 20px;
            font-weight: 600;
            transition: .3s;
        }

        .send-btn:hover {
            background: #564d4d;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #333;
            text-decoration: none;
            font-size: 18px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media(max-width:768px) {

            .change-card {
                width: 100%;
                padding: 40px 25px;
            }

            .title {
                font-size: 34px;
            }

        }
    </style>

</head>

<body>

    <div class="container page-wrapper">

        <div class="change-card">

            <h1 class="title">
                Change Email
            </h1>

            <form id="changeEmailForm">

                <p id="formMessage" class="small text-center" aria-live="polite"></p>

                <div class="mb-3">

                    <input
                        type="email"
                        class="form-control"
                        id="currentEmail"
                        placeholder="Enter Current Email"
                        required>

                </div>

                <div class="mb-4">

                    <input
                        type="email"
                        class="form-control"
                        id="newEmail"
                        placeholder="Enter New Email"
                        required>

                </div>

                <div class="text-center">

                    <button
                        type="submit"
                        class="send-btn">

                        Send OTP

                    </button>

                </div>

                <div class="text-center">

                    <a
                        href="/user/profile"
                        class="back-link">

                        Go back to Profile

                    </a>

                </div>

            </form>

        </div>

    </div>

    <script src="../../assets/js/user/change-email.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
