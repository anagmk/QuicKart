<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quickart | Signup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/signup.css">

</head>

<body>

    <div class="signup-wrapper">

        <div class="signup-card">

            <h1>Create Account</h1>

            <a href="/user/google" class="google-btn">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="25" alt="google">
                Signup with Google
            </a>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="signupForm">

                <div class="mb-3">
                    <input id="name" name="name" type="text" class="form-control" placeholder="Name">
                </div>

                <div class="mb-3">
                    <input id="email" name="email" type="email" class="form-control" placeholder="Email">
                </div>

                <div class="mb-3 password-group">
                    <input id="password" name="password" type="password" class="form-control" placeholder="Password">
                    <i class="bi bi-eye toggle-password" data-target="password" role="button" tabindex="0"
                        aria-label="Show password"></i>
                </div>

                <div class="mb-3 password-group">
                    <input id="confirmPassword" name="confirmPassword" type="password" class="form-control"
                        placeholder="Confirm Password">
                    <i class="bi bi-eye toggle-password" data-target="confirmPassword" role="button" tabindex="0"
                        aria-label="Show confirm password"></i>
                </div>

                <div id="formMessage" class="text-danger small mb-3" aria-live="polite"></div>

                <div class="mb-4">
                    <input id="referral" name="referral" type="text" class="form-control" placeholder="Referral Code">
                </div>

                <div class="text-center">

                    <button class="signup-btn" type="submit">
                        SignUp
                    </button>

                </div>

                <div class="text-center mt-4">

                    Already have account ?

                    <a href="/user/login" class="login-link">
                        Login now..!
                    </a>

                </div>

            </form>

        </div>

    </div>

    <script type="module" src="../../assets/js/auth/signup.js"></script>

</body>

</html>
