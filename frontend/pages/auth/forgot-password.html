<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../assets/css/auth.css">
</head>
<body>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="forgot-card shadow-lg">

        <h1 class="title">Forgot Password ?</h1>

        <p class="subtitle">Please confirm your mail address</p>

        <form id="forgotPasswordForm" novalidate>

            <div class="mb-4">
                <input
                    type="email"
                    id="email"
                    class="form-control custom-input"
                    placeholder="Email address"
                    autocomplete="email"
                    aria-describedby="formMessage"
                >
            </div>

            <p id="formMessage" class="small text-center" aria-live="polite"></p>

            <div class="text-center">
                <button class="btn send-btn" type="submit">
                    Send OTP
                </button>
            </div>

        </form>

        <div class="text-center mt-4">
            <a href="/login" class="back-link">
                Go back to Login page
            </a>
        </div>

    </div>

</div>

    <script type="module" src="../../assets/js/auth/forgot-password.js"></script>
</body>
</html>
